services:
  - type: web
    name: trade-doc-gateway-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Trade Document Gateway & Worker
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: RUN_EMBEDDED_WORKER
        value: "True"
      - key: REDIS_QUEUE_NAME
        value: trade_doc_tasks
      - key: REDIS_CONSUMER_GROUP
        value: trade_doc_worker_group
      - key: REDIS_CONSUMER_NAME
        value: worker-prod-1
      - key: S3_BUCKET_NAME
        value: trade-documents
      - key: S3_REGION
        value: ap-northeast-1
      - key: DEFAULT_LLM_PROVIDER
        value: mistral
      - key: MISTRAL_OCR_MODEL
        value: mistral-ocr-latest
      - key: MISTRAL_EXTRACT_MODEL
        value: pixtral-large-latest
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: MISTRAL_API_KEY
        sync: false
